<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing in to Wildgoose OS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: url("./wallpaper/wildgoose/bg.jpg") center/cover no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 30px;
            color: white;
            font-family: "Microsoft YaHei", sans-serif;
        }

            /* Translucent overlay for clearer text. */
            body::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                z-index: 1;
            }

        /* Title */
        .title {
            font-size: 28px;
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            z-index: 2;
            animation: fadeIn 1s ease forwards;
        }

        /* Loading animation */
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            z-index: 2;
            opacity: 0;
            /* Fade in and rotate continuously. */
            animation: fadeIn 1s ease 0.5s forwards, spin 1s linear infinite;
        }

        /* Status text */
        .tip {
            font-size: 16px;
            color: #ccc;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
            z-index: 2;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        /* Fade-in animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Full rotation animation. */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<audio id="startSound" src="media\startup.mp3" preload="auto" autoplay></audio>

<body>
    <div class="title">Welcome back. Signing in...</div>
    <div class="loader"></div>
    <div class="tip">Wildgoose OS is starting...</div>

    <script>
        // Wait 8 seconds, then smoothly navigate to the desktop.
        setTimeout(() => {
            window.location.replace("desktop.html");
        }, 8000);
    </script>
</body>
</html>

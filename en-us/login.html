<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildgoose OS - Sign in</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: url("./wallpaper/wildgoose/bg.jpg") center/cover no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
            color: white;
        }

        .lock-screen {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 0;
            background: rgba(0, 0, 0, 0.18);
            color: inherit;
            font: inherit;
            cursor: pointer;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
            transition: opacity 0.35s ease, visibility 0.35s ease;
            touch-action: none;
        }

        .lock-time {
            font-size: clamp(72px, 16vw, 144px);
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.06em;
            font-variant-numeric: tabular-nums;
        }

        .lock-date {
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 400;
        }

        .lock-hint {
            position: absolute;
            bottom: 36px;
            font-size: 14px;
            opacity: 0.88;
            animation: hint-float 1.8s ease-in-out infinite;
        }

        @keyframes hint-float {
            50% {
                transform: translateY(-6px);
            }
        }

        .login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        body.login-visible .lock-screen {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        body.login-visible .login-screen {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Avatar */
        .user-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 24px;
        }

        /* Account name */
        .username {
            color: #fff;
            font-size: 20px;
            margin-bottom: 32px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.6);
        }

        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: min(320px, calc(100vw - 40px));
        }

        /* Password field */
        #passwordInput {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 15px;
            outline: none;
            display: none; /* Hidden by default */
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #72c2ff;
            color: #0d1117;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

            .login-btn:hover {
                background: #94d3ff;
            }

        /* Shut down and restart controls */
        .power-group {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
        }

        .power-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .power-btn:hover {
                background: rgba(255, 255, 255, 0.2);
            }

        .shutdown:hover {
            color: #ff5c5c;
        }

        .restart:hover {
            color: #5cccff;
        }
    </style>
</head>
<body>
    <button class="lock-screen" id="lockScreen" type="button" aria-label="Click or swipe up to sign in">
        <span class="lock-time" id="lockTime"></span>
        <span class="lock-date" id="lockDate"></span>
        <span class="lock-hint">Click or swipe up to continue</span>
    </button>

    <main class="login-screen" id="loginScreen">
        <!-- Avatar -->
        <div class="user-avatar">
            <img src="icon.png" style="width:100%;height:100%;object-fit:cover;">
        </div>

        <!-- Administrator account -->
        <div class="username">Administrator</div>

        <div class="login-box">
            <input type="password" id="passwordInput" placeholder="Enter your password">
            <button class="login-btn" onclick="login()">Sign in</button>
        </div>

        <!-- Shut down and restart controls -->
        <div class="power-group">
            <button class="power-btn restart" onclick="restart()" aria-label="Restart">↺</button>
            <button class="power-btn shutdown" onclick="shutdown()" aria-label="Shut down">⏻</button>
        </div>
    </main>

    <script>
        // Password hash function (matches the settings page).
        function hash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                let chr = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + chr;
                hash |= 0;
            }
            return Math.abs(hash).toString(16);
        }

        // Check whether the password field should be shown when the page loads.
        window.onload = function() {
            const hasPwd = localStorage.getItem("wg_login_hash");
            const pwdInput = document.getElementById("passwordInput");
            if (hasPwd) {
                pwdInput.style.display = "block"; // Password is set: show the input.
            } else {
                pwdInput.style.display = "none";  // No password: hide the input.
            }
        };

        function updateLockClock() {
            const now = new Date();
            document.getElementById("lockTime").textContent = now.toLocaleTimeString("en-US", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });
            document.getElementById("lockDate").textContent = now.toLocaleDateString("en-US", {
                year: "numeric",
                month: "long",
                day: "numeric",
                weekday: "long"
            });
        }

        function showLoginScreen() {
            if (document.body.classList.contains("login-visible")) return;
            document.body.classList.add("login-visible");
        }

        updateLockClock();
        window.setInterval(updateLockClock, 1000);
        document.getElementById("lockScreen").addEventListener("click", showLoginScreen);
        document.addEventListener("keydown", function(event) {
            if (event.key !== "Enter") return;
            event.preventDefault();
            if (document.body.classList.contains("login-visible")) {
                login();
            } else {
                showLoginScreen();
            }
        });

        // Sign-in logic.
        function login() {
            const savedHash = localStorage.getItem("wg_login_hash");
            const inputVal = document.getElementById("passwordInput").value;

            // No password is set: continue directly.
            if (!savedHash) {
                location.href = "loginwait.html";
                return;
            }

            // Verify the password.
            if (hash(inputVal) === savedHash) {
                location.href = "loginwait.html";
            } else {
                location.href = "passworderror.html";
            }
        }

        // Restart.
        function restart() {
            location.href = "restart.html";
        }

        // Shut down.
        function shutdown() {
            location.href = "shutdown.html";
        }

        let touchStartY = null;
        const lockScreen = document.getElementById("lockScreen");
        lockScreen.addEventListener("touchstart", function(event) {
            touchStartY = event.changedTouches[0].clientY;
        }, { passive: true });
        lockScreen.addEventListener("touchend", function(event) {
            if (touchStartY === null) return;
            const swipeDistance = touchStartY - event.changedTouches[0].clientY;
            touchStartY = null;
            if (swipeDistance > 40) showLoginScreen();
        }, { passive: true });
    </script>
</body>
</html>

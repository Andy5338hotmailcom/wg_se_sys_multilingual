<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>About Wildgoose</title>
    <script src="settings-theme.js"></script>
    <link rel="stylesheet" href="settings.css">
</head>
<body class="settings-layout">

<div class="sidebar">
    <div class="sidebar-item" onclick="openPersonalizedSettings()">
        <img src="personal.png" alt="">
        Personalization
    </div>
    <div class="sidebar-item" onclick="window.location.href='apps.html'">
        <img src="apps.png" alt="">
        Uninstall apps
    </div>
    <div class="sidebar-item" onclick="window.location.href='account.html'">
        <img src="user.png" alt="">
        Account
    </div>
    <div class="sidebar-item active">
        <img src="about.svg" alt="">
        About
    </div>
</div>

<div class="main">
    <iframe id="versionFrame" frameborder="0" width="100%" height="100%"></iframe>
</div>

<script>
document.getElementById("versionFrame").src =
    "../wgver/" + (window.WG_settingsTheme === "b" ? "black" : "white") + ".html";
</script>
</body>
</html>
